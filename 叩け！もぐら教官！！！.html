<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>叩け！もぐら教官！</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#7fd4ff;
    --sky-bottom:#e9f8ff;
    --sun:#ffd447;
    --accent:#ff9f43;
    --accent-2:#ffc178;
    --accent-dark:#e2701a;
    --grass:#6cc06a;
    --grass-2:#4da653;
    --dirt:#8a5c34;
    --dirt-light:#c98a52;
    --panel:#fffaf0;
    --panel-2:#fff1d6;
    --ink:#2c3550;
    --sign-red:#d1273e;
    --sign-blue:#1c5fc9;
    --ok:#2fb765;
    --ng:#ef4a5e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0;height:100%;}
  body{
    font-family:'M PLUS Rounded 1c', sans-serif;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 55%, #f5fbf3 100%);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  #app{
    width:100%;
    max-width:480px;
    height:100vh;
    height:100dvh;
    position:relative;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .stars{
    position:absolute; inset:0; pointer-events:none; z-index:0;
    background-image:
      radial-gradient(120px 120px at 82% 6%, rgba(255,212,71,.65) 0%, rgba(255,212,71,0) 70%),
      radial-gradient(60px 34px at 15% 12%, #fff 40%, transparent 70%),
      radial-gradient(46px 26px at 30% 9%, #fff 40%, transparent 70%),
      radial-gradient(50px 28px at 68% 18%, #fff 40%, transparent 70%);
    background-repeat:no-repeat;
    opacity:.9;
  }

  .screen{
    position:absolute; inset:0;
    display:none;
    flex-direction:column;
    z-index:1;
  }
  .screen.active{display:flex;}

  /* ---------- HOME ---------- */
  #home{align-items:center; justify-content:center; padding:28px; text-align:center; gap:0;}
  .sun-wrap{width:64px; height:64px; margin-bottom:2px;}
  .sun-wrap svg{width:100%; height:100%; animation:sunspin 16s linear infinite;}
  @keyframes sunspin{100%{transform:rotate(360deg);}}

  .title-jp{
    font-family:'Fredoka','M PLUS Rounded 1c',sans-serif;
    font-size:40px; font-weight:700; letter-spacing:1px; line-height:1.15;
    color:var(--ink);
    text-shadow:-2px 0 #fff, 2px 0 #fff, 0 -2px #fff, 0 2px #fff, 0 6px 14px rgba(44,53,80,.2);
    margin:6px 0 22px;
  }
  .subtitle{
    font-size:13px; letter-spacing:4px; color:var(--accent-dark); font-weight:700; margin-bottom:22px;
  }

  .mole-hero{width:150px; height:150px; margin-bottom:8px;}

  .coin-pill{
    display:inline-flex; align-items:center; gap:6px;
    background:rgba(255,255,255,.65); border:1px solid rgba(44,53,80,.15);
    padding:7px 16px; border-radius:999px; font-size:14px; font-weight:700;
    margin-bottom:26px; color:var(--accent-dark);
    box-shadow:0 2px 8px rgba(44,53,80,.08);
  }
  .coin-dot{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #fff6d0, #f2c14e 60%, #c9930f);box-shadow:inset 0 -2px 2px rgba(0,0,0,.25);}

  .btn{
    font-family:inherit; font-weight:800; font-size:18px; letter-spacing:1px;
    border:none; border-radius:18px; padding:16px 20px; width:100%; max-width:280px;
    cursor:pointer; color:#fff;
    box-shadow:0 5px 0 rgba(44,53,80,.2), 0 8px 18px rgba(44,53,80,.18);
    transition:transform .08s ease;
  }
  .btn:active{transform:translateY(4px); box-shadow:0 1px 0 rgba(44,53,80,.2), 0 4px 10px rgba(44,53,80,.15);}
  .btn-primary{background:linear-gradient(180deg, var(--accent-2), var(--accent)); margin-bottom:12px;}
  .btn-secondary{background:linear-gradient(180deg, #ffffff, var(--panel-2)); color:var(--ink); box-shadow:0 5px 0 rgba(44,53,80,.12), 0 8px 18px rgba(44,53,80,.1); border:2px solid rgba(44,53,80,.1); margin-bottom:12px;}

  /* ---------- TOPBAR (shared) ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; z-index:2; position:relative;
  }
  .icon-btn{
    background:rgba(255,255,255,.6); border:1px solid rgba(44,53,80,.15);
    color:var(--ink); border-radius:12px; padding:9px 14px; font-weight:700;
    font-family:inherit; font-size:14px; cursor:pointer;
  }
  .topbar .score-board{
    background:rgba(255,255,255,.6); border:1px solid rgba(44,53,80,.15);
    border-radius:12px; padding:8px 16px; font-weight:800; font-size:14px; display:flex; gap:14px; color:var(--ink);
  }
  .score-board span.lbl{opacity:.55; font-size:11px; display:block; letter-spacing:1px;}

  /* ---------- GAME ---------- */
  #game{position:relative;}
  .field-wrap{flex:1; position:relative; display:flex; align-items:flex-end; justify-content:center; padding-bottom:2px;}
  .stall{
    width:100%; height:100%;
    background:
      linear-gradient(180deg, transparent 0%, transparent 58%, var(--grass) 58%, var(--grass-2) 100%);
    position:relative; display:flex; align-items:flex-end; justify-content:center;
  }
  .stall:before{ /* wood counter */
    content:''; position:absolute; left:0; right:0; bottom:0; height:8%;
    background:repeating-linear-gradient(90deg, #7a4a26 0 26px, #6c4020 26px 28px);
    border-top:4px solid #a9723c;
    z-index:5;
  }
  .grid{
    position:relative; z-index:3;
    display:grid; grid-template-columns:repeat(3,1fr); gap:16px;
    width:92%; max-width:380px; margin-bottom:11%;
  }
  .hole{
    position:relative; aspect-ratio:1/0.85; cursor:pointer;
    overflow:hidden; border-radius:50%/40%;
  }
  .mound{
    position:absolute; inset:0;
    background:radial-gradient(ellipse at 50% 30%, var(--dirt-light), var(--dirt) 70%);
    border-radius:50%;
    box-shadow:inset 0 6px 10px rgba(0,0,0,.45), 0 4px 0 rgba(0,0,0,.25);
  }
  .hole-black{
    position:absolute; left:16%; right:16%; top:8%; bottom:34%;
    background:#0b0a08; border-radius:50%;
    box-shadow:inset 0 4px 8px #000;
  }
  .occupant{
    position:absolute; left:50%; bottom:30%;
    width:50%; max-width:48px; transform:translate(-50%, 120%); transition:transform .12s ease-out;
    z-index:4; display:flex; align-items:flex-end; justify-content:center;
  }
  .occupant.up{transform:translate(-50%, 2%);}
  .occupant.hit{animation:squash .22s ease-out;}
  @keyframes squash{
    0%{transform:translate(-50%,2%) scale(1,1);}
    40%{transform:translate(-50%,24%) scale(1.25,.7);}
    100%{transform:translate(-50%,150%) scale(.8,.8); opacity:0;}
  }
  .occupant svg{width:100%; height:auto; display:block; filter:drop-shadow(0 4px 4px rgba(0,0,0,.3));}
  .decoy-emoji{line-height:1; text-align:center; display:block; filter:drop-shadow(0 4px 4px rgba(0,0,0,.35));}

  .floater{
    position:absolute; font-weight:800; font-size:16px; color:#fff;
    pointer-events:none; z-index:9; animation:floatup .7s ease-out forwards;
    text-shadow:0 2px 2px rgba(0,0,0,.5);
  }
  @keyframes floatup{
    0%{opacity:1; transform:translateY(0);}
    100%{opacity:0; transform:translateY(-34px);}
  }

  .hammer-pos{
    position:absolute; left:82%; top:74%; width:66px; height:66px; z-index:16; pointer-events:none;
    transform:translate(-50%,-58%);
  }
  .hammer-fixed{
    width:100%; height:100%; display:block;
    transform-origin:78% 78%;
    filter:drop-shadow(0 6px 6px rgba(0,0,0,.28));
    animation:hammerIdle 2.6s ease-in-out infinite;
  }
  .hammer-fixed.swing{animation:hammerSwing .3s ease-out;}
  @keyframes hammerIdle{
    0%,100%{transform:rotate(-8deg);}
    50%{transform:rotate(4deg);}
  }
  @keyframes hammerSwing{
    0%{transform:rotate(-8deg);}
    40%{transform:rotate(-75deg);}
    70%{transform:rotate(20deg);}
    100%{transform:rotate(-8deg);}
  }


  .timerbar-wrap{
    height:8px; background:rgba(44,53,80,.15); border-radius:6px; margin:0 16px 6px; overflow:hidden;
  }
  .timerbar{height:100%; background:linear-gradient(90deg, var(--ok), var(--accent)); width:100%; transition:width 1s linear;}

  /* ---------- QUIZ OVERLAY ---------- */
  .overlay{
    position:absolute; inset:0; z-index:50;
    background:rgba(5,8,20,.72);
    display:none; align-items:center; justify-content:center; padding:24px;
  }
  .overlay.show{display:flex;}
  .sign-card{
    background:var(--panel); color:#221; border-radius:20px; padding:22px 20px 24px;
    width:100%; max-width:300px; text-align:center;
    box-shadow:0 18px 40px rgba(0,0,0,.5);
    animation:dropin .35s cubic-bezier(.2,1.4,.4,1);
    border:6px solid #3b2413;
  }
  @keyframes dropin{
    0%{transform:translateY(-120px) rotate(-4deg); opacity:0;}
    100%{transform:translateY(0) rotate(0); opacity:1;}
  }
  .sign-eyebrow{font-size:11px; letter-spacing:3px; font-weight:800; color:var(--sign-red); margin-bottom:8px;}
  .sign-art{width:120px; height:120px; margin:0 auto 12px;}
  .sign-statement{font-size:15px; font-weight:700; line-height:1.55; margin-bottom:18px; min-height:70px; display:flex; align-items:center; justify-content:center;}
  .quiz-btns{display:flex; gap:14px; justify-content:center;}
  .quiz-btn{
    width:64px; height:64px; border-radius:50%; border:none; font-size:28px; font-weight:900;
    cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,.25);
  }
  .quiz-btn.maru{background:var(--sign-blue); color:#fff;}
  .quiz-btn.batsu{background:var(--sign-red); color:#fff;}
  .quiz-btn:active{transform:translateY(3px); box-shadow:none;}

  .result-flash{
    position:absolute; inset:0; z-index:60; display:none; align-items:center; justify-content:center; flex-direction:column;
    background:rgba(30,36,60,.18);
  }
  .result-flash.show{display:flex; animation:popfade .45s ease forwards;}
  @keyframes popfade{
    0%{opacity:0; transform:scale(.6);}
    20%{opacity:1; transform:scale(1.08);}
    35%{transform:scale(1);}
    75%{opacity:1;}
    100%{opacity:0;}
  }
  .result-mark{font-size:110px; font-weight:900; line-height:1;}
  .result-mark.correct{color:var(--ok); text-shadow:0 0 24px rgba(255,255,255,.8), 0 4px 10px rgba(0,0,0,.2);}
  .result-mark.wrong{color:var(--ng); text-shadow:0 0 24px rgba(255,255,255,.8), 0 4px 10px rgba(0,0,0,.2);}
  .result-sub{font-family:'Fredoka'; font-weight:800; font-size:36px; margin-top:4px; color:var(--ng); text-shadow:0 2px 6px rgba(0,0,0,.35), 0 0 16px rgba(255,255,255,.6);}


  /* ---------- GAMEOVER ---------- */
  #gameover{align-items:center; justify-content:center; text-align:center; padding:30px; gap:8px;}
  .go-panel{background:var(--panel); border:1px solid rgba(44,53,80,.1); border-radius:22px; padding:30px 26px; width:100%; max-width:300px; box-shadow:0 10px 30px rgba(44,53,80,.15);}
  .go-title{font-family:'Fredoka'; font-size:24px; font-weight:700; margin-bottom:14px; color:var(--ink);}
  .go-score{font-size:46px; font-weight:800; color:var(--accent-dark); font-family:'Fredoka';}
  .go-coin{margin:10px 0 22px; color:var(--accent-dark); font-weight:700; display:flex; align-items:center; justify-content:center; gap:6px;}

  /* ---------- COLLECTION ---------- */
  #collection{padding-bottom:10px;}
  .tabs{display:flex; gap:8px; padding:0 16px 12px;}
  .tab{
    flex:1; text-align:center; padding:10px 0; border-radius:12px; font-weight:800; font-size:14px;
    background:rgba(255,255,255,.55); cursor:pointer; border:1px solid rgba(44,53,80,.12); color:var(--ink);
  }
  .tab.active{background:linear-gradient(180deg, var(--accent-2), var(--accent)); color:#2b1200; border-color:transparent;}
  .coll-grid{
    flex:1; overflow-y:auto; display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:4px 16px 20px;
  }
  .skin-card{
    background:var(--panel); border-radius:16px; padding:14px 10px 12px; text-align:center;
    border:2px solid rgba(44,53,80,.08); position:relative;
  }
  .skin-card.equipped{border-color:var(--accent);}
  .skin-card.locked{opacity:.6;}
  .skin-art{width:64px; height:64px; margin:0 auto 8px;}
  .skin-name{font-size:13px; font-weight:800; margin-bottom:4px; color:var(--ink);}
  .skin-req{font-size:11px; opacity:.65; margin-bottom:8px;}
  .skin-tag{font-size:11px; font-weight:800; padding:5px 0; border-radius:8px; background:rgba(44,53,80,.08); color:var(--ink);}
  .skin-tag.equip-btn{background:var(--accent); color:#2b1200; cursor:pointer;}
  .lock-badge{position:absolute; top:8px; right:8px; font-size:14px;}

  /* ---------- GACHA ---------- */
  .gacha-wrap{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; gap:16px; text-align:center;}
  .machine{width:180px;}
  .machine-dome{
    width:170px; height:130px; margin:0 auto; position:relative; overflow:hidden;
    border-radius:50% 50% 18% 18% / 62% 62% 18% 18%;
    background:linear-gradient(180deg, rgba(255,255,255,.6), rgba(255,255,255,.18));
    border:5px solid #d8e0f0;
    box-shadow:inset 0 -8px 14px rgba(0,0,0,.06);
  }
  .capsule-dot{position:absolute; width:22px; height:22px; border-radius:50%; box-shadow:inset -3px -3px 0 rgba(0,0,0,.12);}
  .machine-slot{width:52px; height:16px; background:#2c3550; border-radius:8px; margin:-8px auto 0; position:relative; z-index:2;}
  .machine-base{width:150px; height:56px; margin:0 auto; background:linear-gradient(180deg,var(--accent-2),var(--accent)); border-radius:0 0 18px 18px; box-shadow:0 6px 0 rgba(44,53,80,.15);}

  .gacha-hint{font-size:13px; color:var(--ink); opacity:.75; max-width:260px; line-height:1.5;}

  .capsule-reveal{
    width:88px; height:88px; border-radius:50%; font-size:40px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(180deg,#fff,var(--panel-2)); border:4px solid var(--accent);
    animation:capsuleShake .55s ease-in-out;
  }
  @keyframes capsuleShake{
    0%,100%{transform:rotate(0);}
    20%{transform:rotate(-14deg) translateX(-3px);}
    40%{transform:rotate(11deg) translateX(3px);}
    60%{transform:rotate(-9deg);}
    80%{transform:rotate(6deg);}
  }
  .gacha-result-card{
    width:100%; max-width:220px; padding:18px 16px 16px;
    animation:dropin .4s cubic-bezier(.2,1.4,.4,1);
  }
  .gacha-msg{font-family:'Fredoka'; font-weight:700; font-size:18px; color:var(--accent-dark); margin-bottom:6px;}
  .gacha-result-card .skin-art{width:76px; height:76px;}

  #btn-gacha-pull.insufficient{animation:shakeX .4s ease;}
  @keyframes shakeX{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-6px);}
    75%{transform:translateX(6px);}
  }

  /* ---------- QUIZ LIST (debug) ---------- */
  .quizlist-wrap{flex:1; overflow-y:auto; padding:4px 16px 24px; display:flex; flex-direction:column; gap:12px;}
  .quiz-row{
    background:var(--panel); border-radius:14px; padding:12px 14px; display:flex; gap:12px; align-items:center;
    border:1px solid rgba(44,53,80,.08);
  }
  .quiz-row-art{width:44px; height:44px; flex:0 0 auto;}
  .quiz-row-body{flex:1; min-width:0;}
  .quiz-row-statement{font-size:12.5px; line-height:1.5; color:var(--ink);}
  .quiz-row-answer{
    flex:0 0 auto; font-family:'Fredoka'; font-weight:800; font-size:20px; width:34px; height:34px;
    border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff;
  }
  .quiz-row-answer.t{background:var(--sign-blue);}
  .quiz-row-answer.f{background:var(--sign-red);}

  .hidden{display:none !important;}
</style>
</head>
<body>
<div id="app">
  <div class="stars"></div>

  <!-- HOME -->
  <div class="screen active" id="home">
    <div class="sun-wrap">
      <svg viewBox="0 0 64 64">
        <g stroke="#ffb703" stroke-width="4" stroke-linecap="round">
          <line x1="32" y1="2" x2="32" y2="12"/><line x1="32" y1="52" x2="32" y2="62"/>
          <line x1="2" y1="32" x2="12" y2="32"/><line x1="52" y1="32" x2="62" y2="32"/>
          <line x1="10" y1="10" x2="17" y2="17"/><line x1="47" y1="47" x2="54" y2="54"/>
          <line x1="54" y1="10" x2="47" y2="17"/><line x1="17" y1="47" x2="10" y2="54"/>
        </g>
        <circle cx="32" cy="32" r="16" fill="var(--sun)"/>
      </svg>
    </div>
    <svg class="mole-hero" viewBox="0 0 120 120"><use href="#mole-classic"/></svg>
    <div class="title-jp">叩け！<br>もぐら教官！</div>
    <div class="coin-pill"><span class="coin-dot"></span><span id="home-coins">0</span> コイン</div>
    <button class="btn btn-primary" id="btn-play">ゲームスタート</button>
    <button class="btn btn-secondary" id="btn-gacha">🎰 ガチャ</button>
    <button class="btn btn-secondary" id="btn-collection">🎨 コレクション</button>
    <button class="btn btn-secondary" id="btn-quizlist">🔒 問題一覧</button>
  </div>

  <!-- GAME -->
  <div class="screen" id="game">
    <div class="topbar">
      <button class="icon-btn" id="btn-quit">← やめる</button>
      <div class="score-board">
        <div><span class="lbl">SCORE</span><span id="game-score">0</span></div>
        <div><span class="lbl">TIME</span><span id="game-time">45</span></div>
      </div>
    </div>
    <div class="timerbar-wrap"><div class="timerbar" id="timerbar"></div></div>
    <div class="field-wrap">
      <div class="stall">
        <div class="grid" id="grid"></div>
        <div class="hammer-pos" id="hammer-pos">
          <svg class="hammer-fixed" id="hammer-fixed" viewBox="0 0 60 60">
            <use href="#hammer-wood" id="hammer-fixed-use"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- quiz overlay -->
    <div class="overlay" id="quiz-overlay">
      <div class="sign-card">
        <div class="sign-eyebrow">教習所 標識クイズ</div>
        <svg class="sign-art" id="sign-art" viewBox="0 0 100 100"></svg>
        <div class="sign-statement" id="sign-statement">-</div>
        <div class="quiz-btns">
          <button class="quiz-btn maru" data-ans="true">○</button>
          <button class="quiz-btn batsu" data-ans="false">✕</button>
        </div>
      </div>
    </div>
    <div class="result-flash" id="result-flash">
      <div class="result-mark" id="result-mark">○</div>
      <div class="result-sub" id="result-sub"></div>
    </div>
  </div>

  <!-- GAME OVER -->
  <div class="screen" id="gameover">
    <div class="go-panel">
      <div class="go-title">タイムアップ！</div>
      <div class="go-score" id="final-score">0</div>
      <div class="go-coin"><span class="coin-dot"></span>+<span id="earned-coins">0</span> コイン獲得</div>
      <button class="btn btn-primary" id="btn-retry">もう一度</button>
      <button class="btn btn-secondary" id="btn-home2">ホームへ</button>
    </div>
  </div>

  <!-- COLLECTION -->
  <div class="screen" id="collection">
    <div class="topbar">
      <button class="icon-btn" id="btn-back-home">← ホーム</button>
      <div class="score-board"><div><span class="lbl">COIN</span><span id="coll-coins">0</span></div></div>
    </div>
    <div class="tabs">
      <div class="tab active" data-tab="mole">🐹 モグラ</div>
      <div class="tab" data-tab="hammer">🔨 ハンマー</div>
    </div>
    <div class="coll-grid" id="coll-grid"></div>
  </div>

  <!-- GACHA -->
  <div class="screen" id="gacha">
    <div class="topbar">
      <button class="icon-btn" id="btn-back-home2">← ホーム</button>
      <div class="score-board"><div><span class="lbl">COIN</span><span id="gacha-coins">0</span></div></div>
    </div>
    <div class="gacha-wrap">
      <div class="machine">
        <div class="machine-dome">
          <span class="capsule-dot" style="left:14%;top:20%;background:#ff9f43;"></span>
          <span class="capsule-dot" style="left:55%;top:14%;background:#1c5fc9;"></span>
          <span class="capsule-dot" style="left:32%;top:44%;background:#2fb765;"></span>
          <span class="capsule-dot" style="left:65%;top:46%;background:#ef4a5e;"></span>
          <span class="capsule-dot" style="left:20%;top:60%;background:#ffd447;"></span>
          <span class="capsule-dot" style="left:52%;top:66%;background:#ff9f43;"></span>
        </div>
        <div class="machine-slot"></div>
        <div class="machine-base"></div>
      </div>

      <rect x="26" y="20" width="8" height="36" rx="3" fill="#caa233"/>
      <rect x="8" y="4" width="44" height="20" rx="5" fill="#f1c40f"/>
      <rect x="8" y="4" width="44" height="7" rx="3" fill="#fff2ae"/>
    </symbol>
    <symbol id="hammer-rubber" viewBox="0 0 60 60">
      <rect x="26" y="20" width="8" height="36" rx="3" fill="#8a2f2f"/>
      <rect x="8" y="4" width="44" height="20" rx="8" fill="#e74c3c"/>
      <rect x="8" y="4" width="44" height="7" rx="4" fill="#ff9a8d"/>
    </symbol>
    <symbol id="hammer-ice" viewBox="0 0 60 60">
      <rect x="26" y="20" width="8" height="36" rx="3" fill="#4aa9c9"/>
      <rect x="8" y="4" width="44" height="20" rx="5" fill="#a8e6f5"/>
      <rect x="8" y="4" width="44" height="7" rx="3" fill="#eafcff"/>
    </symbol>
  </defs>
</svg>

<script>
(function(){
  // ---------------- DATA ----------------
  const MOLE_SKINS = [
    {id:'classic', name:'もぐら教官'},
    {id:'golden',  name:'金のもぐら'},
    {id:'ninja',   name:'忍者もぐら'},
    {id:'panda',   name:'パンダもぐら'},
  ];
  const HAMMER_SKINS = [
    {id:'wood',   name:'木づち'},
    {id:'gold',   name:'ゴールドハンマー'},
    {id:'rubber', name:'ラバーハンマー'},
    {id:'ice',    name:'アイスハンマー'},
  ];
  const HAMMER_SYMBOL = {wood:'hammer-wood', gold:'hammer-gold', rubber:'hammer-rubber', ice:'hammer-ice'};
  const MOLE_SYMBOL = {classic:'mole-classic', golden:'mole-golden', ninja:'mole-ninja', panda:'mole-panda'};
  const GACHA_COST = 30;
  const GACHA_POOL = [
    ...MOLE_SKINS.filter(s=>s.id!=='classic').map(s=>({type:'mole', id:s.id, name:s.name})),
    ...HAMMER_SKINS.filter(s=>s.id!=='wood').map(s=>({type:'hammer', id:s.id, name:s.name})),
  ];

  const DECOYS = ['🌸','🪨','🐱','🦔','🚧','🍄'];

  // simplified original road-sign style icons (educational quiz, not exact legal reproduction)
  const SIGNS = [
    { art:`<polygon points="50,8 92,88 8,88" fill="#fff" stroke="#d1273e" stroke-width="8"/><text x="50" y="66" font-size="20" font-weight="800" text-anchor="middle" fill="#d1273e" font-family="sans-serif">止まれ</text>`,
      statement:'この標識がある場所では、車は一時停止しなければならない。', answer:true },
    { art:`<circle cx="50" cy="50" r="42" fill="#1c5fc9"/><polygon points="50,20 66,50 58,50 58,80 42,80 42,50 34,50" fill="#fff"/>`,
      statement:'この標識がある道路では、右折や左折をしてもよい。', answer:false },
    { art:`<circle cx="50" cy="50" r="42" fill="#fff" stroke="#d1273e" stroke-width="8"/><rect x="16" y="44" width="68" height="12" rx="2" fill="#d1273e"/>`,
      statement:'この標識がある場所には、車は進入できない。', answer:true },
    { art:`<polygon points="50,10 90,85 10,85" fill="#f5c518" stroke="#2a2a2a" stroke-width="5"/><text x="50" y="68" font-size="18" font-weight="800" text-anchor="middle" fill="#2a2a2a" font-family="sans-serif">徐行</text>`,
      statement:'この標識がある場所では、速度を落とさなくてよい。', answer:false },
    { art:`<circle cx="50" cy="50" r="42" fill="#fff" stroke="#d1273e" stroke-width="8"/><line x1="20" y1="70" x2="80" y2="30" stroke="#d1273e" stroke-width="8"/><ellipse cx="42" cy="55" rx="20" ry="10" fill="#333"/><ellipse cx="70" cy="42" rx="14" ry="8" fill="#999"/>`,
      statement:'この標識がある区間では、他の車を追い越してはいけない。', answer:true },
    { art:`<circle cx="50" cy="50" r="42" fill="#1c5fc9"/><line x1="20" y1="70" x2="80" y2="30" stroke="#d1273e" stroke-width="8"/><text x="50" y="58" font-size="26" font-weight="800" text-anchor="middle" fill="#fff" font-family="sans-serif">P</text>`,
      statement:'この標識がある場所には、車を停めて買い物に行ってもよい。', answer:false },
    { art:`<polygon points="50,10 90,50 50,90 10,50" fill="#f5c518" stroke="#2a2a2a" stroke-width="5"/><circle cx="50" cy="46" r="9" fill="#2a2a2a"/><polygon points="50,55 42,78 58,78" fill="#2a2a2a"/>`,
      statement:'この標識は、付近に子供が飛び出すおそれがあることを示している。', answer:true },
    { art:`<circle cx="50" cy="50" r="42" fill="#fff" stroke="#d1273e" stroke-width="8"/><text x="50" y="60" font-size="26" font-weight="800" text-anchor="middle" fill="#222" font-family="sans-serif">40</text>`,
      statement:'この標識がある道路では、時速60kmで走行してよい。', answer:false },
    { art:`<circle cx="50" cy="50" r="42" fill="#1c5fc9"/><circle cx="50" cy="50" r="26" fill="#fff"/><circle cx="50" cy="50" r="26" fill="none"/><path d="M32 50a18 18 0 0136 0" fill="none" stroke="#1c5fc9" stroke-width="6"/><line x1="50" y1="24" x2="50" y2="76" stroke="#1c5fc9" stroke-width="6"/>`,
      statement:'この標識がある道路は、歩行者・自転車専用であることを示している。', answer:true },
  ];

  // ---------------- STATE ----------------
  const state = {
    coins: 0,
    equippedMole: 'classic',
    equippedHammer: 'wood',
    unlockedMole: new Set(['classic']),
    unlockedHammer: new Set(['wood']),
    screen: 'home',
    score: 0,
    time: 45,
    running: false,
    quizActive: false,
    spawnTimer: null,
    tickTimer: null,
    occupied: {}, // holeIndex -> {type, el, hideTimeout}
  };
  const TOTAL_TIME = 45;

  // ---------------- DOM refs ----------------
  const $ = (id)=>document.getElementById(id);
  const screens = {
    home: $('home'), game: $('game'), gameover: $('gameover'), collection: $('collection'), gacha: $('gacha'), quizlist: $('quizlist')
  };
  function showScreen(name){
    Object.values(screens).forEach(s=>s.classList.remove('active'));
    screens[name].classList.add('active');
    state.screen = name;
  }

  function useSymbol(href){ return `<use href="#${href}"/>`; }

  // ---------------- HOME ----------------
  function refreshHomeCoins(){ $('home-coins').textContent = state.coins; }
  $('btn-play').addEventListener('click', ()=>{ startGame(); });
  $('btn-gacha').addEventListener('click', ()=>{ openGacha(); });
  $('btn-collection').addEventListener('click', ()=>{ openCollection(); });
  $('btn-quizlist').addEventListener('click', ()=>{ openQuizList(); });

  // ---------------- GRID BUILD ----------------
  const grid = $('grid');
  for(let i=0;i<9;i++){
    const hole = document.createElement('div');
    hole.className='hole'; hole.dataset.index=i;
    hole.innerHTML = `<div class="mound"></div><div class="hole-black"></div>`;
    hole.addEventListener('pointerdown', (e)=>onHoleTap(i, e));
    grid.appendChild(hole);
  }
  const holeEls = Array.from(grid.children);

  function updateHammerIcon(){
    $('hammer-fixed-use').setAttribute('href', '#'+HAMMER_SYMBOL[state.equippedHammer]);
  }
  function resetHammerPosition(){
    const pos = $('hammer-pos');
    pos.style.left = '82%';
    pos.style.top = '74%';
  }
  let hammerSwingTimeout = null;
  function swingHammerAt(leftPct, topPct){
    const posEl = $('hammer-pos');
    posEl.style.left = leftPct + '%';
    posEl.style.top = topPct + '%';
    const el = $('hammer-fixed');
    el.classList.remove('swing');
    void el.offsetWidth;
    el.classList.add('swing');
    if(hammerSwingTimeout) clearTimeout(hammerSwingTimeout);
    hammerSwingTimeout = setTimeout(()=>el.classList.remove('swing'), 300);
  }
  function swingHammer(holeEl){
    const stallEl = document.querySelector('.stall');
    if(holeEl && stallEl){
      const holeRect = holeEl.getBoundingClientRect();
      const stallRect = stallEl.getBoundingClientRect();
      const leftPct = ((holeRect.left + holeRect.width/2) - stallRect.left) / stallRect.width * 100;
      const topPct = ((holeRect.top + holeRect.height*0.32) - stallRect.top) / stallRect.height * 100;
      swingHammerAt(leftPct, topPct);
    }
  }
  function swingHammerAtClientPoint(clientX, clientY){
    const stallEl = document.querySelector('.stall');
    if(!stallEl) return;
    const r = stallEl.getBoundingClientRect();
    const leftPct = (clientX - r.left) / r.width * 100;
    const topPct = (clientY - r.top) / r.height * 100;
    swingHammerAt(Math.max(4, Math.min(96, leftPct)), Math.max(4, Math.min(96, topPct)));
  }
  document.querySelector('.stall').addEventListener('pointerdown', (e)=>{
    if(!state.running || state.quizActive) return;
    if(e.target.closest('.hole')) return; // holes already trigger their own swing
    swingHammerAtClientPoint(e.clientX, e.clientY);
  });

  function floatText(hole, text, color){
    const f = document.createElement('div');
    f.className='floater'; f.textContent=text;
    f.style.left='50%'; f.style.top='0%'; f.style.transform='translateX(-50%)';
    if(color) f.style.color=color;
    hole.appendChild(f);
    setTimeout(()=>f.remove(), 720);
  }

  function clearHole(i){
    const occ = state.occupied[i];
    if(!occ) return;
    if(occ.hideTimeout) clearTimeout(occ.hideTimeout);
    if(occ.el) occ.el.remove();
    delete state.occupied[i];
  }

  function spawnOne(){
    if(!state.running || state.quizActive) return;
    const emptyIdx = holeEls.map((_,i)=>i).filter(i=>!state.occupied[i]);
    if(emptyIdx.length===0) return;
    const i = emptyIdx[Math.floor(Math.random()*emptyIdx.length)];
    const isMole = Math.random() < 0.72;
    const el = document.createElement('div');
    el.className='occupant';
    if(isMole){
      el.innerHTML = `<svg viewBox="0 0 120 120">${useSymbol(MOLE_SYMBOL[state.equippedMole])}</svg>`;
    } else {
      const emoji = DECOYS[Math.floor(Math.random()*DECOYS.length)];
      el.innerHTML = `<span class="decoy-emoji">${emoji}</span>`;
      const holeWidthPx = holeEls[i].getBoundingClientRect().width;
      const sizePx = Math.min(holeWidthPx*0.5, 48);
      el.querySelector('.decoy-emoji').style.fontSize = Math.round(sizePx) + 'px';
    }
    holeEls[i].appendChild(el);
    requestAnimationFrame(()=>el.classList.add('up'));
    const activeTime = 580 + Math.random()*300;
    const hideTimeout = setTimeout(()=>{ clearHole(i); }, activeTime);
    state.occupied[i] = {type:isMole?'mole':'decoy', el, hideTimeout};
  }

  function onHoleTap(i, evt){
    if(!state.running || state.quizActive) return;
    swingHammer(holeEls[i]);
    const occ = state.occupied[i];
    if(!occ) return;
    if(occ.type==='mole'){
      state.score += 50;
      $('game-score').textContent = state.score;
      floatText(holeEls[i], '+50', '#ffd23f');
      occ.el.classList.add('hit');
      clearTimeout(occ.hideTimeout);
      delete state.occupied[i];
      setTimeout(()=>{ occ.el.remove(); }, 220);
    } else {
      state.score -= 50;
      $('game-score').textContent = state.score;
      floatText(holeEls[i], '-50', '#ef4a5e');
      clearHole(i);
      triggerQuiz();
    }
  }

  // ---------------- QUIZ ----------------
  function triggerQuiz(){
    state.quizActive = true;
    pauseTimers();
    const q = SIGNS[Math.floor(Math.random()*SIGNS.length)];
    $('sign-art').innerHTML = q.art;
    $('sign-statement').textContent = q.statement;
    $('quiz-overlay').classList.add('show');
    $('quiz-overlay').dataset.answer = q.answer;
  }
  document.querySelectorAll('.quiz-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const chosen = btn.dataset.ans === 'true';
      const correct = $('quiz-overlay').dataset.answer === 'true';
      const isRight = chosen === correct;
      $('quiz-overlay').classList.remove('show');
      showResultFlash(isRight);
      if(isRight){ state.score += 5; } else { state.score -= 500; }
      $('game-score').textContent = state.score;
      setTimeout(()=>{
        state.quizActive = false;
        if(state.running) resumeTimers();
      }, 460);
    });
  });
  function showResultFlash(isRight){
    const mark = $('result-mark'); const flash = $('result-flash'); const sub = $('result-sub');
    mark.textContent = isRight ? '○' : '✕';
    mark.className = 'result-mark ' + (isRight?'correct':'wrong');
    sub.textContent = isRight ? '' : '-500';
    flash.classList.remove('show'); void flash.offsetWidth; flash.classList.add('show');
    setTimeout(()=>flash.classList.remove('show'), 450);
  }

  // ---------------- GAME LOOP ----------------
  function pauseTimers(){
    if(state.spawnTimer){ clearInterval(state.spawnTimer); state.spawnTimer=null; }
    if(state.tickTimer){ clearInterval(state.tickTimer); state.tickTimer=null; }
  }
  function resumeTimers(){
    if(!state.spawnTimer) state.spawnTimer = setInterval(spawnOne, 500);
    if(!state.tickTimer) state.tickTimer = setInterval(tick, 1000);
  }
  function tick(){
    if(state.quizActive) return;
    state.time -= 1;
    $('game-time').textContent = Math.max(0,state.time);
    $('timerbar').style.width = Math.max(0,(state.time/TOTAL_TIME*100))+'%';
    if(state.time<=0) endGame();
  }

  function startGame(){
    state.score = 0; state.time = TOTAL_TIME; state.running = true; state.quizActive=false;
    state.occupied = {};
    holeEls.forEach(h=>{ Array.from(h.querySelectorAll('.occupant')).forEach(o=>o.remove()); });
    $('game-score').textContent = '0';
    $('game-time').textContent = TOTAL_TIME;
    $('timerbar').style.width='100%';
    updateHammerIcon();
    resetHammerPosition();
    showScreen('game');
    resumeTimers();
  }

  function endGame(){
    state.running = false;
    pauseTimers();
    holeEls.forEach((h,i)=>clearHole(i));
    const earned = Math.max(0, Math.floor(state.score/10));
    state.coins += earned;
    $('final-score').textContent = state.score;
    $('earned-coins').textContent = earned;
    showScreen('gameover');
  }

  $('btn-quit').addEventListener('click', ()=>{
    state.running=false; pauseTimers(); holeEls.forEach((h,i)=>clearHole(i));
    showScreen('home'); refreshHomeCoins();
  });
  $('btn-retry').addEventListener('click', ()=>{ startGame(); });
  $('btn-home2').addEventListener('click', ()=>{ showScreen('home'); refreshHomeCoins(); });

  // ---------------- GACHA ----------------
  function openGacha(){
    $('gacha-coins').textContent = state.coins;
    $('gacha-capsule').classList.add('hidden');
    $('gacha-result').classList.add('hidden');
    $('gacha-idle-text').classList.remove('hidden');
    showScreen('gacha');
  }
  $('btn-back-home2').addEventListener('click', ()=>{ showScreen('home'); refreshHomeCoins(); });

  let gachaBusy = false;
  $('btn-gacha-pull').addEventListener('click', ()=>{
    if(gachaBusy) return;
    if(state.coins < GACHA_COST){
      const btn = $('btn-gacha-pull');
      btn.classList.remove('insufficient'); void btn.offsetWidth; btn.classList.add('insufficient');
      setTimeout(()=>btn.classList.remove('insufficient'), 420);
      return;
    }
    gachaBusy = true;
    state.coins -= GACHA_COST;
    $('gacha-coins').textContent = state.coins;
    $('gacha-idle-text').classList.add('hidden');
    $('gacha-result').classList.add('hidden');
    const capsule = $('gacha-capsule');
    capsule.classList.remove('hidden');
    capsule.style.animation='none'; void capsule.offsetWidth; capsule.style.animation='';
    setTimeout(()=>{
      capsule.classList.add('hidden');
      revealGachaResult();
      gachaBusy = false;
    }, 620);
  });

  function revealGachaResult(){
    const item = GACHA_POOL[Math.floor(Math.random()*GACHA_POOL.length)];
    const unlockedSet = item.type==='mole' ? state.unlockedMole : state.unlockedHammer;
    const symbolMap = item.type==='mole' ? MOLE_SYMBOL : HAMMER_SYMBOL;
    const viewBox = item.type==='mole' ? '0 0 120 120' : '0 0 60 60';
    let msg;
    if(!unlockedSet.has(item.id)){
      unlockedSet.add(item.id);
      msg = '🎉 NEW! てにいれた！';
    } else {
      state.coins += 10;
      $('gacha-coins').textContent = state.coins;
      msg = 'ダブり… +10コイン';
    }
    $('gacha-result-msg').textContent = msg;
    $('gacha-result-art').innerHTML = `${useSymbol(symbolMap[item.id])}`;
    $('gacha-result-art').setAttribute('viewBox', viewBox);
    $('gacha-result-name').textContent = item.name;
    $('gacha-result').classList.remove('hidden');
  }

  // ---------------- QUIZ LIST (debug) ----------------
  function openQuizList(){
    renderQuizList();
    showScreen('quizlist');
  }
  $('btn-back-home3').addEventListener('click', ()=>{ showScreen('home'); refreshHomeCoins(); });
  function renderQuizList(){
    $('quizlist-count').textContent = SIGNS.length;
    const wrap = $('quizlist-wrap');
    wrap.innerHTML = '';
    SIGNS.forEach(q=>{
      const row = document.createElement('div');
      row.className = 'quiz-row';
      row.innerHTML = `
        <svg class="quiz-row-art" viewBox="0 0 100 100">${q.art}</svg>
        <div class="quiz-row-body"><div class="quiz-row-statement">${q.statement}</div></div>
        <div class="quiz-row-answer ${q.answer ? 't':'f'}">${q.answer ? '○' : '✕'}</div>
      `;
      wrap.appendChild(row);
    });
  }

  // ---------------- COLLECTION ----------------
  let collTab = 'mole';
  function openCollection(){
    $('coll-coins').textContent = state.coins;
    renderCollection();
    showScreen('collection');
  }
  document.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click', ()=>{
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      collTab = t.dataset.tab;
      renderCollection();
    });
  });
  $('btn-back-home').addEventListener('click', ()=>{ showScreen('home'); refreshHomeCoins(); });

  function renderCollection(){
    const list = collTab==='mole' ? MOLE_SKINS : HAMMER_SKINS;
    const symbolMap = collTab==='mole' ? MOLE_SYMBOL : HAMMER_SYMBOL;
    const unlockedSet = collTab==='mole' ? state.unlockedMole : state.unlockedHammer;
    const equipped = collTab==='mole' ? state.equippedMole : state.equippedHammer;
    const wrap = $('coll-grid');
    wrap.innerHTML='';
    list.forEach(skin=>{
      const unlocked = unlockedSet.has(skin.id);
      const card = document.createElement('div');
      card.className = 'skin-card' + (equipped===skin.id?' equipped':'') + (!unlocked?' locked':'');
      const viewBox = collTab==='mole' ? '0 0 120 120' : '0 0 60 60';
      card.innerHTML = `
        ${!unlocked ? '<div class="lock-badge">🔒</div>' : ''}
        <svg class="skin-art" viewBox="${viewBox}">${useSymbol(symbolMap[skin.id])}</svg>
        <div class="skin-name">${skin.name}</div>
        <div class="skin-req">${unlocked ? (equipped===skin.id?'使用中':'獲得済み') : 'ガチャで手に入れよう'}</div>
        <div class="skin-tag ${unlocked && equipped!==skin.id ? 'equip-btn':''}">${equipped===skin.id ? '装備中' : (unlocked ? '装備する' : '未入手')}</div>
      `;
      if(unlocked && equipped!==skin.id){
        card.querySelector('.equip-btn').addEventListener('click', ()=>{
          if(collTab==='mole') state.equippedMole = skin.id; else state.equippedHammer = skin.id;
          renderCollection();
        });
      }
      wrap.appendChild(card);
    });
  }

  refreshHomeCoins();
})();
</script>
</body>
</html>
